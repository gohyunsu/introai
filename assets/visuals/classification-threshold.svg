<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" role="img" aria-labelledby="title desc">
  <title id="title">분류 점수, 확률과 임곗값</title>
  <desc id="desc">로짓이 시그모이드를 거쳐 확률이 되고 임곗값에 따라 정밀도와 재현율의 균형이 달라지는 모습</desc>
  <rect width="900" height="480" rx="28" fill="#f4f1e8"/>
  <path d="M70 382V70M70 382H525" stroke="#171813" stroke-width="3"/>
  <path d="M86 354C210 350 238 320 288 226S390 92 510 88" fill="none" stroke="#9d83ee" stroke-width="7"/>
  <path d="M70 226H525" stroke="#ff755d" stroke-width="3" stroke-dasharray="9 7"/>
  <path d="M288 70V382" stroke="#171813" stroke-width="2" stroke-dasharray="5 6"/>
  <text x="82" y="216" font-family="sans-serif" font-size="14">τ = 0.5</text>
  <text x="270" y="412" font-family="sans-serif" font-size="14">logit z = 0</text>
  <text x="108" y="112" font-family="sans-serif" font-size="19" font-weight="800">σ(z)</text>
  <rect x="575" y="82" width="260" height="126" rx="20" fill="#e8ff64" stroke="#171813" stroke-width="2"/>
  <text x="604" y="122" font-family="sans-serif" font-size="17" font-weight="800">임곗값을 낮추면</text>
  <text x="604" y="158" font-family="sans-serif" font-size="15">양성 예측 ↑ · 재현율 ↑</text>
  <text x="604" y="182" font-family="sans-serif" font-size="15">오탐도 늘 수 있음</text>
  <rect x="575" y="238" width="260" height="126" rx="20" fill="#eef4ff" stroke="#171813" stroke-width="2"/>
  <text x="604" y="278" font-family="sans-serif" font-size="17" font-weight="800">임곗값을 높이면</text>
  <text x="604" y="314" font-family="sans-serif" font-size="15">양성 예측 ↓ · 정밀도 ↑</text>
  <text x="604" y="338" font-family="sans-serif" font-size="15">놓침도 늘 수 있음</text>
  <text x="575" y="412" font-family="sans-serif" font-size="14">모델 점수와 운영 결정은 분리한다</text>
</svg>
