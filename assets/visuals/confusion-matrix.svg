<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" role="img" aria-labelledby="title desc">
  <title id="title">이진 분류 혼동행렬</title>
  <desc id="desc">실제 클래스와 예측 클래스로 구성한 TN, FP, FN, TP 네 칸과 정밀도 재현율의 분모</desc>
  <rect width="900" height="480" rx="28" fill="#f4f1e8"/>
  <text x="48" y="56" font-family="sans-serif" font-size="24" font-weight="800">정확도보다 먼저 네 칸의 절대 건수를 본다</text>
  <g transform="translate(128 110)" font-family="sans-serif" text-anchor="middle">
    <text x="300" y="-18" font-size="16" font-weight="800">PREDICTED</text><text x="-54" y="154" font-size="16" font-weight="800" transform="rotate(-90 -54 154)">ACTUAL</text>
    <text x="150" y="16" font-size="14">NEGATIVE</text><text x="450" y="16" font-size="14">POSITIVE</text>
    <text x="-18" y="104" font-size="14">NEG</text><text x="-18" y="254" font-size="14">POS</text>
    <rect x="0" y="34" width="300" height="150" fill="#eef4ff" stroke="#171813" stroke-width="2"/><rect x="300" y="34" width="300" height="150" fill="#ff755d" fill-opacity=".35" stroke="#171813" stroke-width="2"/>
    <rect x="0" y="184" width="300" height="150" fill="#ff755d" fill-opacity=".35" stroke="#171813" stroke-width="2"/><rect x="300" y="184" width="300" height="150" fill="#e8ff64" stroke="#171813" stroke-width="2"/>
    <text x="150" y="106" font-size="28" font-weight="900">TN</text><text x="450" y="106" font-size="28" font-weight="900">FP</text><text x="150" y="256" font-size="28" font-weight="900">FN</text><text x="450" y="256" font-size="28" font-weight="900">TP</text>
    <text x="150" y="136" font-size="13">정상을 정상으로</text><text x="450" y="136" font-size="13">헛경보</text><text x="150" y="286" font-size="13">놓침</text><text x="450" y="286" font-size="13">이상을 탐지</text>
  </g>
  <text x="450" y="450" text-anchor="middle" font-family="sans-serif" font-size="15">Precision = TP / (TP + FP)  ·  Recall = TP / (TP + FN)</text>
</svg>
