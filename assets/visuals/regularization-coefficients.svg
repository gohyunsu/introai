<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" role="img" aria-labelledby="title desc">
  <title id="title">OLS, Ridge, Lasso의 계수 비교</title>
  <desc id="desc">규제가 없는 회귀, 계수를 작게 줄이는 Ridge, 일부 계수를 0으로 만드는 Lasso의 막대 비교</desc>
  <rect width="900" height="480" rx="28" fill="#f4f1e8"/>
  <text x="50" y="58" font-family="sans-serif" font-size="24" font-weight="800">규제는 계수를 지우는 벌이 아니라 복잡도 예산이다</text>
  <g transform="translate(54 98)" font-family="sans-serif">
    <g><rect width="244" height="310" rx="18" fill="#fff" stroke="#171813" stroke-width="2"/><text x="22" y="38" font-size="18" font-weight="800">OLS</text><path d="M28 260H216" stroke="#171813"/><g fill="#6d9ef8"><rect x="42" y="82" width="25" height="178"/><rect x="78" y="218" width="25" height="42"/><rect x="114" y="126" width="25" height="134"/><rect x="150" y="58" width="25" height="202"/><rect x="186" y="194" width="25" height="66"/></g><text x="22" y="292" font-size="14">계수 폭이 큼</text></g>
    <g transform="translate(272)"><rect width="244" height="310" rx="18" fill="#eef4ff" stroke="#171813" stroke-width="2"/><text x="22" y="38" font-size="18" font-weight="800">RIDGE · L2</text><path d="M28 260H216" stroke="#171813"/><g fill="#9d83ee"><rect x="42" y="142" width="25" height="118"/><rect x="78" y="224" width="25" height="36"/><rect x="114" y="174" width="25" height="86"/><rect x="150" y="124" width="25" height="136"/><rect x="186" y="208" width="25" height="52"/></g><text x="22" y="292" font-size="14">모두 남기되 작게</text></g>
    <g transform="translate(544)"><rect width="244" height="310" rx="18" fill="#fff" stroke="#171813" stroke-width="2"/><text x="22" y="38" font-size="18" font-weight="800">LASSO · L1</text><path d="M28 260H216" stroke="#171813"/><g fill="#ff755d"><rect x="42" y="156" width="25" height="104"/><rect x="78" y="258" width="25" height="2"/><rect x="114" y="258" width="25" height="2"/><rect x="150" y="140" width="25" height="120"/><rect x="186" y="258" width="25" height="2"/></g><text x="22" y="292" font-size="14">일부는 정확히 0</text></g>
  </g>
  <text x="450" y="452" text-anchor="middle" font-family="sans-serif" font-size="14">α가 커질수록 규제가 강해진다 · 스케일을 맞춘 뒤 비교한다</text>
</svg>
